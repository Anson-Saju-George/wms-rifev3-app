services:
  wms:
    build: .
    ports:
      # Host port comes from .env PORT; container internal port is always 8000.
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s